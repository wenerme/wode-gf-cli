name: Dev Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Dev Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Prepare Release Files
        run: |
          mkdir -p release
          cp dist/wode-gf-cli.js release/wode-gf-cli.js
          cp README.md release/README.md
          cp README.zh-CN.md release/README.zh-CN.md
          (cd release && zip -r ../wode-gf-cli-dev.zip .)
          shasum -a 256 wode-gf-cli-dev.zip > wode-gf-cli-dev.zip.sha256

      - name: Upload Release Files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-release
          path: |
            wode-gf-cli-dev.zip
            wode-gf-cli-dev.zip.sha256
          if-no-files-found: error

  release:
    name: Publish Dev Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download Release Files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dev-release

      - name: Update dev tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/dev" -f sha="${GITHUB_SHA}" -F force=true; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/dev" -f sha="${GITHUB_SHA}"
          fi

      - name: Publish Dev Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: dev
          name: Development Release
          prerelease: true
          generate_release_notes: false
          append_body: false
          fail_on_unmatched_files: true
          files: |
            wode-gf-cli-dev.zip
            wode-gf-cli-dev.zip.sha256
